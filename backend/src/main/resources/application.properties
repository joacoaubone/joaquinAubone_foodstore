spring.application.name=foodstore-backend
spring.profiles.default=api
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379/0}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
foodstore.bcrypt.max-concurrente=${FOODSTORE_BCRYPT_MAX_CONCURRENTE:2}
foodstore.jwt.secret=${JWT_SECRET}
foodstore.jwt.access-ttl=${ACCESS_TOKEN_TTL:PT30M}
foodstore.jwt.refresh-ttl=${REFRESH_TOKEN_TTL:P7D}
foodstore.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
foodstore.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
foodstore.login.max-intentos=${LOGIN_MAX_INTENTOS:5}
foodstore.login.ventana-min=${LOGIN_VENTANA_MIN:15}
